<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodgewire</title>
<!-- Added to a tablet's home screen (P8f): its own full screen, landscape, no browser bars. -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<!-- Cross-origin isolation for the Runner's threads (shared memory): GitHub Pages sends no
     COOP/COEP headers, so this service worker adds them, reloading the page once. Always
     COEP require-corp: its default switches to credentialless on every browser but Chrome and
     Firefox from the second load on, and Safari, without credentialless, then is not isolated
     ("The object can not be cloned" at start on an iPad's reload, 2026-11-25). Every file is
     the page's own, so require-corp loses nothing. -->
<script>window.coi = { coepCredentialless: () => false };</script>
<script src="coi-serviceworker.js"></script>
<style>
  /* A finger held or dragged on the page (P8f): no text selected, no callout, no bounce, no
     grey flash on a tap. */
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas {
    display: block; outline: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6ff; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none;
  }
  /* On a phone: a notice over the page at start, the app loading behind it. */
  #mobile {
    position: fixed; inset: 0; z-index: 1; display: none; align-items: center;
    justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.85);
    font: 16px/1.5 system-ui, sans-serif;
  }
  #mobile > div {
    max-width: 28em; padding: 24px; border: 1px solid #6ff; border-radius: 8px;
    background: #111; color: #ddd;
  }
  #mobile h1 { margin: 0 0 12px; color: #6ff; font-size: 20px; }
  #mobile p { margin: 0 0 12px; }
  #mobile button {
    margin-top: 8px; padding: 10px 20px; border: 0; border-radius: 6px; background: #6ff;
    color: #000; font: inherit; font-weight: 600;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading Bodgewire…</div>
<div id="mobile" role="dialog" aria-labelledby="mobile-title">
  <div>
    <h1 id="mobile-title">Not made for phones</h1>
    <p>Bodgewire needs a large screen: a tablet's or a computer's. On a phone its Boards and
       its controls are too small to work with.</p>
    <p>You are welcome to try it anyway: the Machines run, slowly.</p>
    <button id="mobile-ok" type="button">Try it anyway</button>
  </div>
</div>
<script>
  const status = document.getElementById('status');
  let stopped = false;
  var Module = {
    canvas: document.getElementById('canvas'),
    // bw_ui's command line from the address: ?arg=/machines/070-tennis/tennis.bwn
    arguments: new URLSearchParams(location.search).getAll('arg'),
    setStatus(text) {
      if (stopped) return;  // the error stays: the download's progress would hide it
      status.textContent = text;
      status.style.display = text ? 'flex' : 'none';
    },
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
  };
  if (window.crossOriginIsolated === false && !window.isSecureContext) {
    Module.setStatus('Bodgewire needs HTTPS (or localhost) to run its threads.');
  }
  // An error at start (memory refused, a failed compile) shown on the page, where a tablet with no
  // console can read it, and kept.
  // SDL's fill-document window hides every element of the body but the canvas (SDL3's
  // SDL3_fill_document_background_elements): what must stay in view goes under <html>, above it.
  const keepInView = (element) => {
    element.style.zIndex = '2';
    document.documentElement.appendChild(element);
  };
  const stop = (why) => {
    if (stopped) return;
    Module.setStatus('Bodgewire stopped: ' + (why || 'see the console.'));
    keepInView(status);
    stopped = true;
  };
  window.addEventListener('error', (e) => stop(e.error?.message || e.message));
  window.addEventListener('unhandledrejection', (e) => stop(e.reason?.message || String(e.reason)));

  // A phone (P8f: a tablet works): a finger as the main pointer and a screen under 600 px on
  // its shorter side; or ?mobile to see the notice on a desktop. Once per tab: the service
  // worker's reload does not ask again.
  (() => {
    const forced = new URLSearchParams(location.search).has('mobile');
    const touch = matchMedia('(pointer: coarse)').matches || navigator.userAgentData?.mobile;
    const phone = touch && Math.min(screen.width, screen.height) < 600;
    let seen = false;
    try { seen = sessionStorage.getItem('bw-mobile-seen') === '1'; } catch {}
    if (!forced && (!phone || seen)) return;
    const notice = document.getElementById('mobile');
    notice.style.display = 'flex';
    keepInView(notice);  // it waits for "Try it anyway", whenever the game's window opens
    document.getElementById('mobile-ok').addEventListener('click', () => {
      notice.style.display = 'none';
      try { sessionStorage.setItem('bw-mobile-seen', '1'); } catch {}
      Module.canvas.focus();
    });
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
